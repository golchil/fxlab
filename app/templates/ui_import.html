{% extends "base.html" %}

{% block title %}FXLab - Import CSV{% endblock %}

{% block content %}
<div class="container">
    <div class="header-row">
        <h1>Import CSV</h1>
        <a href="/ui/datasets" class="btn">&larr; Back to List</a>
    </div>

    <section class="form-section">
        <form action="/ui/import" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>
                    <input type="checkbox" id="append_mode" name="append_mode" onchange="toggleAppendMode()">
                    既存データセットに追加（Append）
                </label>
            </div>

            <div id="append-section" style="display:none;">
                <div class="form-group">
                    <label for="dataset_id">追加先データセット</label>
                    <select id="dataset_id" name="dataset_id" onchange="onDatasetSelect()">
                        <option value="">-- 選択してください --</option>
                        {% for ds in datasets %}
                        <option value="{{ ds.id }}" data-timezone="{{ ds.timezone }}">{{ ds.name }} (ID:{{ ds.id }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div id="new-section">
                <div class="form-group">
                    <label for="name">Dataset Name *</label>
                    <input type="text" id="name" name="name" placeholder="e.g., USDJPY_2024">
                </div>
            </div>

            <div class="form-group">
                <label for="timezone">Timezone</label>
                <input type="text" id="timezone" name="timezone" value="Asia/Tokyo">
            </div>
            <div class="form-group">
                <label for="timeframe">Timeframe</label>
                <select id="timeframe" name="timeframe">
                    <option value="M1" selected>M1 (1 minute)</option>
                    <option value="M5">M5 (5 minutes)</option>
                    <option value="M15">M15 (15 minutes)</option>
                    <option value="M30">M30 (30 minutes)</option>
                    <option value="H1">H1 (1 hour)</option>
                    <option value="H4">H4 (4 hours)</option>
                    <option value="D1">D1 (1 day)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="file">CSV File *</label>
                <input type="file" id="file" name="file" accept=".csv" required>
                <small>ForexTester format: TICKER,DTYYYYMMDD,TIME,OPEN,HIGH,LOW,CLOSE,VOL</small>
            </div>
            <button type="submit" class="btn btn-primary">Upload and Import</button>
        </form>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleAppendMode() {
    var checked = document.getElementById('append_mode').checked;
    document.getElementById('append-section').style.display = checked ? 'block' : 'none';
    document.getElementById('new-section').style.display = checked ? 'none' : 'block';
    var nameInput = document.getElementById('name');
    if (checked) {
        nameInput.removeAttribute('required');
    }
}

function onDatasetSelect() {
    var sel = document.getElementById('dataset_id');
    var opt = sel.options[sel.selectedIndex];
    if (opt && opt.dataset.timezone) {
        document.getElementById('timezone').value = opt.dataset.timezone;
    }
}
</script>
{% endblock %}
